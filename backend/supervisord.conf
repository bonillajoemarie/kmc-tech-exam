[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:octane]
; Laravel Octane (FrankenPHP) - HTTP server, port 8000.
; FrankenPHP also serves the /broadcasting/auth and /api routes.
command=php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000 --caddyfile=/app/frankenphp/Caddyfile
directory=/app
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/app/storage/logs/octane.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:reverb]
; Laravel Reverb - WebSocket server, port 8080.
command=php artisan reverb:start --host=0.0.0.0 --port=8080
directory=/app
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/app/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3